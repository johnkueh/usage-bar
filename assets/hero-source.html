<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Usage Bar README hero</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1944px; height: 809px; overflow: hidden; }
  body {
    color: #171717;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
    background-color: #f7f4ed;
    background-image:
      linear-gradient(rgba(185,179,167,.28) 1px, transparent 1px),
      linear-gradient(90deg, rgba(185,179,167,.28) 1px, transparent 1px);
    background-size: 72px 72px;
  }
  main { position: relative; width: 100%; height: 100%; }
  .copy { position: absolute; left: 92px; top: 276px; }
  h1 { margin: 0; font-size: 118px; line-height: .9; letter-spacing: -7px; font-weight: 750; }
  .meter { display: inline-block; width: 52px; height: 14px; margin: 0 20px 20px 15px; border-radius: 999px; background: #32c966; }
  .subtitle { margin: 48px 0 0 4px; color: #57534d; font-size: 35px; line-height: 1.4; letter-spacing: -.5px; }
  .meta { display: flex; gap: 20px; align-items: center; margin: 56px 0 0 4px; color: #777169; font-size: 22px; font-weight: 600; letter-spacing: .5px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #aaa399; }
  .menu {
    position: absolute; right: 84px; top: 48px; width: 606px; height: 711px;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; border-radius: 34px; background: #222223;
    box-shadow: 0 20px 48px rgba(37,35,31,.2);
  }
  .menu img { width: 590px; height: 705px; object-fit: contain; }
</style>
<main>
  <section class="copy">
    <h1>usage<span class="meter"></span>bar</h1>
    <p class="subtitle">Claude Code, Codex, and Grok usage.<br>One native Mac menu.</p>
    <div class="meta"><span>MACOS 13+</span><span class="dot"></span><span>LOCAL</span><span class="dot"></span><span>OPEN SOURCE</span></div>
  </section>
  <div class="menu"><img src="menu-dark.png" alt=""></div>
</main>
</html>
